[package]
name = "quant-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "quant"
path = "src/main.rs"

[dependencies]
quant-core = { path = "../core" }
quant-db = { path = "../db" }
quant-download = { path = "../download" }
quant-data = { path = "../data" }
quant-factors = { path = "../factors" }
quant-strategy = { path = "../strategy" }
quant-backtest = { path = "../backtest" }
quant-trading = { path = "../trading" }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono"] }
clap = { workspace = true }
dotenvy = "0.15"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
indicatif = { workspace = true }
chrono = { workspace = true }
rayon = { workspace = true }
rustc-hash = { workspace = true }
